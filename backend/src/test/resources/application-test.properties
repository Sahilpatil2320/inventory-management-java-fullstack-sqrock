# In-memory H2 database in MySQL mode: tests need no external MySQL server.
spring.datasource.url=jdbc:h2:mem:inventory_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
app.bootstrap.admin-email=
app.bootstrap.admin-password=
