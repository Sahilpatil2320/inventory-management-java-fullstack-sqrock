# All environment-specific values come from environment variables, so this file is safe to commit.
# See application.properties.example and the README for the full list.
spring.application.name=inventory-management
server.port=${PORT:${SERVER_PORT:8080}}

# ---- MySQL (use the least-privilege 'inventory_app' account, never root) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:inventory_app}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by database/schema.sql, so Hibernate never changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ---- Security ----
# JWT_SECRET is mandatory (at least 32 characters). There is intentionally no default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First administrator, created only while the users table is empty (see README).
app.bootstrap.admin-name=${INITIAL_ADMIN_NAME:Administrator}
app.bootstrap.admin-email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-stacktrace=never
